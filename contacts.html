<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact | Angela Wafula</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #eef2f7 50%, #e2e8f0 100%);
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header & Nav */
    header.site-header {
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 20px 5%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    header.site-header h1 {
      font-size: 1.8rem;
      margin-bottom: 5px;
      color: #0284c7;
    }

    header.site-header p {
      font-weight: 300;
      font-size: 1.1rem;
      color: #64748b;
    }

    nav.site-nav {
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: flex-start;
      gap: 25px;
      padding: 15px 5%;
    }

    nav.site-nav a {
      color: #334155;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      padding: 8px 16px;
      border-radius: 6px;
      transition: all 0.3s ease;
    }

    nav.site-nav a:hover {
      color: #0284c7;
      background: rgba(2, 132, 199, 0.08);
    }

    nav.site-nav a.active {
      color: #0284c7;
      background: rgba(2, 132, 199, 0.12);
    }

    /* Main section with form */
    main {
      flex: 1 0 auto;
      max-width: 600px;
      margin: 40px auto 60px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      width: 95%;
    }

    main h2 {
      color: #0284c7;
      font-size: 2rem;
      margin-bottom: 30px;
      text-align: center;
    }

    form.contact-form {
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    form.contact-form .form-group {
      display: flex;
      flex-direction: column;
    }

    form.contact-form label {
      font-weight: 600;
      margin-bottom: 8px;
      display: block;
      color: #0369a1;
      font-size: 1.05rem;
    }

    form.contact-form input[type="text"],
    form.contact-form input[type="email"],
    form.contact-form textarea {
      width: 100%;
      padding: 14px 15px;
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      border-radius: 6px;
      font-size: 1rem;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1e293b;
      resize: vertical;
      transition: all 0.3s ease;
    }

    form.contact-form input[type="text"]:focus,
    form.contact-form input[type="email"]:focus,
    form.contact-form textarea:focus {
      border-color: #0284c7;
      outline: none;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.12);
    }

    form.contact-form input[type="text"]::placeholder,
    form.contact-form input[type="email"]::placeholder,
    form.contact-form textarea::placeholder {
      color: #94a3b8;
    }

    form.contact-form textarea {
      min-height: 150px;
    }

    form.contact-form button {
      background: #0284c7;
      color: #ffffff;
      font-weight: bold;
      padding: 16px 20px;
      border: none;
      border-radius: 6px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
      letter-spacing: 0.5px;
    }

    form.contact-form button:hover {
      background: #0369a1;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(2, 132, 199, 0.25);
    }

    form.contact-form button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .form-status {
      text-align: center;
      font-size: 0.95rem;
      min-height: 1.2rem;
    }

    .form-status.success { color: #16a34a; }
    .form-status.error { color: #dc2626; }

    /* Contact info section */
    .contact-info {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 1px solid #e2e8f0;
    }

    .contact-info h3 {
      color: #0284c7;
      margin-bottom: 20px;
      font-size: 1.5rem;
    }

    .contact-details {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .contact-details p {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #334155;
      font-size: 1.05rem;
    }

    .contact-details strong {
      color: #0369a1;
      min-width: 100px;
      display: inline-block;
    }

    /* Footer */
    footer.site-footer {
      flex-shrink: 0;
      background: #ffffff;
      color: #64748b;
      text-align: center;
      padding: 25px 5%;
      border-top: 1px solid #e2e8f0;
      font-size: 0.9rem;
    }

    /* Responsive */
    @media (max-width: 650px) {
      main {
        margin: 20px auto 40px;
        padding: 30px 20px;
        max-width: 95%;
      }

      nav.site-nav {
        gap: 15px;
        padding: 12px 5%;
        flex-wrap: wrap;
      }

      nav.site-nav a {
        padding: 8px 12px;
        font-size: 0.95rem;
      }

      .contact-details p {
        flex-direction: column;
        align-items: flex-start;
        gap: 5px;
      }

      .contact-details strong {
        min-width: auto;
      }
    }

    @media (max-width: 480px) {
      header.site-header h1 {
        font-size: 1.6rem;
      }

      header.site-header p {
        font-size: 1rem;
      }

      main h2 {
        font-size: 1.7rem;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <h1>Angela Wafula</h1>
    <p>Cybersecurity Analyst | Penetration Tester | Application Security</p>
  </header>

  <nav class="site-nav">
    <a href="index.html">Home</a>
    <a href="https://github.com/angelah1994" target="_blank">GitHub</a>
    <a href="contacts.html" class="active">Get in Touch</a>
  </nav>

  <main>
    <h2>Contact Me</h2>

    <!-- Email contact form -->
    <form class="contact-form" id="contactForm" action="https://formspree.io/f/xqervege" method="POST">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Your full name" required />
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="_replyto" placeholder="Your email address" required />
      </div>

      <div class="form-group">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" placeholder="Subject of your message" required />
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Type your message here..." required></textarea>
      </div>

      <button type="submit" id="submitBtn">Send Message</button>
      <p class="form-status" id="formStatus"></p>
    </form>

    <!-- Alternative contact information -->
    <div class="contact-info">
      <h3>Direct Contact</h3>
      <div class="contact-details">
        <p><strong>Email:</strong> wafulaangelah@yahoo.com</p>
        <p><strong>Phone:</strong> +254722624649</p>
        <p><strong>Location:</strong> Nairobi, Kenya</p>
        <p><strong>LinkedIn:</strong> linkedin.com/in/angela-wafula</p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Angela Wafula. All rights reserved.</p>
  </footer>

  <script>
    const form = document.getElementById('contactForm');
    const status = document.getElementById('formStatus');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();

      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';
      status.textContent = '';
      status.className = 'form-status';

      try {
        const response = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        });

        if (response.ok) {
          status.textContent = 'Message sent! I will get back to you soon.';
          status.classList.add('success');
          form.reset();
        } else {
          throw new Error('Form submission failed');
        }
      } catch (err) {
        status.textContent = 'Something went wrong. Please email me directly at wafulaangelah@yahoo.com';
        status.classList.add('error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Message';
      }
    });
  </script>
</body>
</html>
